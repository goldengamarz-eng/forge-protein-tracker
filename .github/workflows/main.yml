name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          unzip -o forge-protein-tracker-source.zip
          cp -rn forge-protein-tracker-source/* . || true
          rm -rf forge-protein-tracker-source || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Protein-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
